<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HIGH - LVL DAILY · Rundown</title>
<link rel="stylesheet" href="/assets/brand.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
.gate{width:min(420px,92vw);text-align:center}
.gate .wm{font-size:88px}
.gate form{margin-top:44px;display:flex;flex-direction:column;gap:12px}
.gate input{font-family:var(--mono);font-size:18px;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--paper);background:transparent;border:0;border-bottom:1px solid var(--gold);padding:14px;outline:none}
.gate input:focus{border-bottom-color:var(--paper)}
.gate button{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:0;padding:14px;cursor:pointer;margin-top:8px}
.gate .err{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);min-height:16px;margin-top:8px}
.gate .sub{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:40px}
</style>
</head>
<body>
<div class="grain"></div>
<div class="gate">
  <div class="wm"><div class="wm-l1">HIGH - LVL</div><div class="wm-l2">DAILY<span class="dot"></span></div><div class="wm-rule"></div><div class="wm-sub">Producer Desk · Private</div></div>
  <form id="f">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Unlock the Desk</button>
    <div class="err" id="err"></div>
  </form>
  <div class="sub">A HIGH - LVL NETWORK production</div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const r = await fetch('/api/auth', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) { const next = new URLSearchParams(location.search).get('next'); location.href = next && next.startsWith('/') ? next : '/desk'; }
  else err.textContent = 'Wrong password';
});
</script>
</body>
</html>
